<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{
  --bg:#ffffff; --bg-side:#f6f7f9; --text:#1f2328; --muted:#59636e; --border:#d8dee4;
  --accent:#0b6bcb; --accent-soft:#e6f0fb; --code-bg:#eef0f3; --pre-bg:#0f172a; --pre-text:#e2e8f0;
  --info:#2f6fd6; --info-bg:#e7f1ff; --tip:#0b8a5c; --tip-bg:#e3f6ee; --warn:#c98a00; --warn-bg:#fff6e0;
  --danger:#d13c3c; --danger-bg:#fdecec; --imp:#7c4dcc; --imp-bg:#f1eafd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --bg-side:#11161d; --text:#e6edf3; --muted:#9aa5b1; --border:#262f3a;
    --accent:#58a6ff; --accent-soft:#0f1e33; --code-bg:#1c232c; --pre-bg:#070b11; --pre-text:#d6deeb;
    --info:#5b9bf5; --info-bg:#0f1e33; --tip:#3ddc97; --tip-bg:#0f261c; --warn:#e6b030; --warn-bg:#2b2310;
    --danger:#f06a6a; --danger-bg:#2c1414; --imp:#b18cf2; --imp-bg:#1f1630;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --bg-side:#11161d; --text:#e6edf3; --muted:#9aa5b1; --border:#262f3a;
  --accent:#58a6ff; --accent-soft:#0f1e33; --code-bg:#1c232c; --pre-bg:#070b11; --pre-text:#d6deeb;
  --info:#5b9bf5; --info-bg:#0f1e33; --tip:#3ddc97; --tip-bg:#0f261c; --warn:#e6b030; --warn-bg:#2b2310;
  --danger:#f06a6a; --danger-bg:#2c1414; --imp:#b18cf2; --imp-bg:#1f1630;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
header .logo{font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .spacer{flex:1}
#progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg-side);color:var(--text);border-radius:6px;padding:4px 10px}
#menuBtn{display:none}
.layout{display:flex}
nav{width:290px;flex-shrink:0;position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;background:var(--bg-side);border-right:1px solid var(--border);padding:16px 12px}
nav input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);margin-bottom:12px}
nav a{display:block;padding:5px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:14.5px;line-height:1.4}
nav a:hover{color:var(--text);background:var(--code-bg)}
nav a.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
main{flex:1;min-width:0;max-width:900px;padding:24px 36px 100px}
h1{font-size:2.1rem;margin:.2em 0 .4em}
h2{font-size:1.55rem;margin-top:2.6em;padding-top:.5em;border-top:1px solid var(--border)}
h3{font-size:1.15rem;margin-top:1.8em}
h4{font-size:1rem;margin-top:1.4em}
hr{display:none}
p,li{max-width:75ch}
a{color:var(--accent)}
code{font:0.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code-bg);padding:.12em .35em;border-radius:4px}
pre{position:relative;background:var(--pre-bg);color:var(--pre-text);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:13.5px;line-height:1.55}
pre code,pre code.hljs{background:none;padding:0;color:inherit;font-size:inherit}
pre .copy{position:absolute;top:8px;right:8px;font-size:12px;padding:2px 8px;background:#ffffff14;color:#cbd5e1;border-color:#ffffff22}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--bg-side)}
.callout{--c:var(--info);--cb:var(--info-bg);border-left:4px solid var(--c);background:var(--cb);border-radius:6px;padding:10px 14px;margin:16px 0}
.callout>:last-child{margin-bottom:0}
.callout .ctitle,.callout summary{font-weight:700;color:var(--c)}
.callout summary{cursor:pointer}
.callout.tip{--c:var(--tip);--cb:var(--tip-bg)}
.callout.warning{--c:var(--warn);--cb:var(--warn-bg)}
.callout.danger{--c:var(--danger);--cb:var(--danger-bg)}
.callout.important{--c:var(--imp);--cb:var(--imp-bg)}
.callout.question{--c:var(--accent);--cb:var(--accent-soft);margin:8px 0}
.callout.question summary{color:var(--text)}
@media (max-width:860px){
  #menuBtn{display:inline-block}
  nav{position:fixed;left:0;top:53px;z-index:9;transform:translateX(-100%);transition:transform .2s}
  nav.open{transform:none;box-shadow:0 0 40px #0005}
  main{padding:20px 16px 80px}
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="Toggle menu">☰</button>
  <span class="logo">{{TITLE}}</span>
  <span class="spacer"></span>
  <button id="themeBtn" aria-label="Toggle theme">◐ Theme</button>
  <div id="progress"></div>
</header>
<div class="layout">
<nav id="nav">
<input id="search" type="search" placeholder="Filter topics…" aria-label="Filter topics">
{{NAV}}
</nav>
<main>
{{BODY}}
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
// syntax highlighting when online; plain code otherwise
if (window.hljs) document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

document.querySelectorAll('pre').forEach(pre => {
  const b = document.createElement('button');
  b.className = 'copy'; b.textContent = 'Copy';
  b.onclick = () => navigator.clipboard.writeText(pre.querySelector('code').innerText)
    .then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); });
  pre.appendChild(b);
});

const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
document.getElementById('themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
};

const nav = document.getElementById('nav');
document.getElementById('menuBtn').onclick = () => nav.classList.toggle('open');
nav.addEventListener('click', e => { if (e.target.tagName === 'A') nav.classList.remove('open'); });

document.getElementById('search').oninput = e => {
  const q = e.target.value.toLowerCase();
  nav.querySelectorAll('a').forEach(a => a.style.display = a.textContent.toLowerCase().includes(q) ? '' : 'none');
};

const links = [...nav.querySelectorAll('a')];
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
  });
}, { rootMargin: '-20% 0px -70% 0px' });
document.querySelectorAll('main h2[id]').forEach(h => obs.observe(h));

const bar = document.getElementById('progress');
addEventListener('scroll', () => {
  const h = document.documentElement;
  bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
}, { passive: true });
</script>
</body>
</html>
