<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Notes</title>
<meta name="description" content="Personal developer notes by Parampreet Singh: Fastify, TypeScript and more.">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#666;--line:#e5e5e5;--hover:#f5f5f5}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f5f5f5;--muted:#999;--line:#262626;--hover:#141414}
}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f5f5f5;--muted:#999;--line:#262626;--hover:#141414}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}
.brand{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.01em}
button{font:inherit;font-size:14px;cursor:pointer;background:none;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{background:var(--hover)}
.hero{padding:56px 0 28px}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;letter-spacing:-.03em;margin:0 0 12px}
.hero p{color:var(--muted);margin:0;max-width:56ch}
.search{position:relative;margin:28px 0 8px}
.search input{width:100%;font:inherit;padding:12px 44px 12px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;outline:none}
.search input:focus{border-color:var(--fg)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.count{font:13px ui-monospace,Menlo,monospace;color:var(--muted);margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:48px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:border-color .15s,background .15s}
.card:hover,.card:focus-visible{border-color:var(--fg);background:var(--hover);outline:none}
.card h2{font-size:1.1rem;margin:0;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:.9rem;color:var(--muted);transition:transform .15s}
.card:hover h2 span{transform:translateX(3px);color:var(--fg)}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.meta{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">notes.parampreetsingh.dev</span>
    <button id="theme" aria-label="Toggle theme">◐</button>
  </header>

  <section class="hero">
    <h1>Developer Notes</h1>
    <p>Study notes on the tools I use: concepts, code, common mistakes and quick-reference cheat sheets.</p>
    <div class="search">
      <input id="q" type="search" placeholder="Search notes…" aria-label="Search notes" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="count" id="count"></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer>© <span id="year"></span> Parampreet Singh</footer>
</div>

<script>
// Add a new note: drop public/<slug>.html in, then add one entry here.
const NOTES = [
  {
    slug: 'fastify',
    title: 'Fastify',
    desc: 'Build a REST API: routes, plugins, schema validation, MongoDB, hooks, auth and file uploads.',
    tags: ['nodejs', 'backend', 'mongodb'],
    sections: 25,
  },
  {
    slug: 'typescript',
    title: 'TypeScript',
    desc: 'Beginner to advanced: types, interfaces, unions, type guards, classes, generics, utility types, enums and async.',
    tags: ['typescript', 'javascript'],
    sections: 23,
  },
];

const grid = document.getElementById('grid');
const count = document.getElementById('count');
const q = document.getElementById('q');

function render(term = '') {
  const t = term.trim().toLowerCase();
  const list = NOTES.filter(n => !t || [n.title, n.desc, ...n.tags].join(' ').toLowerCase().includes(t));
  grid.innerHTML = list.length ? list.map(n => `
    <a class="card" href="/${n.slug}">
      <h2>${n.title}<span>→</span></h2>
      <p>${n.desc}</p>
      <div class="meta">${n.sections} sections</div>
      <div class="tags">${n.tags.map(x => `<span>${x}</span>`).join('')}</div>
    </a>`).join('') : `<div class="empty">No notes match “${term.replace(/</g, '&lt;')}”.</div>`;
  count.textContent = `${list.length} of ${NOTES.length} notes`;
}

q.addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
});

const root = document.documentElement;
try { const s = localStorage.getItem('theme'); if (s) root.dataset.theme = s; } catch {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
};

document.getElementById('year').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
